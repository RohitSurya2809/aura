[project]
name = "aura"
version = "0.1.0"
description = "A lightweight, agentic personal AI companion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "black>=24.0",
    "mypy>=1.13",
    "coverage>=7.0",
    "sqlalchemy[mypy]>=2.0",
]

[project.scripts]
aura = "aura.interfaces.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "A",                # flake8-builtins
    "COM",              # flake8-commas
    "C4",               # flake8-comprehensions
    "ISC",              # flake8-implicit-str-concat
    "ICN",              # flake8-import-conventions
    "PIE",              # flake8-pie
    "T20",              # flake8-print
    "PT",               # flake8-pytest-style
    "RET",              # flake8-return
    "SLF",              # flake8-self
    "SIM",              # flake8-simplify
    "TCH",              # flake8-type-checking
    "ARG",              # flake8-unused-arguments
    "PTH",              # flake8-use-pathlib
]
ignore = [
    "COM812",           # trailing comma (conflicts with formatter)
    "ISC001",           # single-line implicit string concat (conflicts with formatter)
    "UP046",            # Generic[] subclass vs type params (mypy strict compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["aura"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["aura"]
plugins = ["pydantic.mypy"]


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a running PostgreSQL instance",
]

[tool.coverage.run]
source = ["aura"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
